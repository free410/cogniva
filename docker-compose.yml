name: knowledge

services:
  # PostgreSQL 数据库 (带 pgvector 扩展)
  postgres:
    image: pgvector/pgvector:pg15
    container_name: knowledge_assistant_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在根目录 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_assistant_pgvector}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: knowledge_assistant_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: knowledge_assistant_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # 容器内数据库/Redis 地址（覆盖 .env 中的宿主机地址）
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-knowledge_assistant_pgvector}
      REDIS_URL: redis://redis:6379
      DEBUG: "false"
    ports:
      # 仅本机可直连，便于调试；对外统一走 nginx
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      # 精排模型（bge-reranker-v2-m3），只读挂载，不打进镜像
      - ./models:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 前端服务（不对外暴露端口，由 nginx 转发）
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 留空 = 同源访问，由 nginx 代理 /api 到后端
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: knowledge_assistant_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - backend

  # 反向代理：统一入口
  nginx:
    image: nginx:1.27-alpine
    container_name: knowledge_assistant_nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
